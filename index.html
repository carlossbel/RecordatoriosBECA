<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuestros Recordatorios</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Geist:wght@400;500;600&display=swap">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23dc2644'%3E%3Cpath d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E">
<style>
  /* Pure white canvas, confident blue type accent, warm red for hearts. */
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --ink: #16213e;
    --ink-soft: #5a6478;
    --ink-faint: #a8aebb;
    --line: #e8e8ee;
    --line-strong: #d4d7e0;
    --blue: #2451e6;
    --blue-soft: #ecf0ff;
    --red: #dc2644;
    --red-soft: #fff0f2;
    --radius: 10px;
    --radius-sm: 6px;
    color-scheme: light;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--bg); }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', ui-sans-serif, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 56px;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .wrap { max-width: 560px; margin: 0 auto; }

  /* Header */
  .header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px 0 36px;
    text-align: center;
  }
  .hearts {
    display: inline-flex;
    gap: 7px;
    align-items: center;
  }
  .hearts svg { width: 13px; height: 13px; display: block; }
  .hearts .h-red { color: var(--red); }
  .hearts .h-blue { color: var(--blue); }
  .title {
    font-family: 'Fraunces', ui-serif, 'Iowan Old Style', Georgia, serif;
    font-weight: 400;
    font-size: 40px;
    letter-spacing: -0.02em;
    line-height: 1.05;
    text-wrap: balance;
    margin: 0;
    font-variation-settings: 'opsz' 72;
  }
  .title em {
    font-style: italic;
    color: var(--blue);
    font-weight: 400;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 13px;
    margin: 0;
    font-variant-caps: all-small-caps;
    letter-spacing: 0.12em;
    font-weight: 500;
  }

  /* Add form */
  .add-form {
    display: flex;
    gap: 6px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .add-form:focus-within {
    border-color: var(--blue);
    box-shadow: 0 0 0 3px var(--blue-soft);
  }
  .add-form input {
    flex: 1;
    min-width: 0;
    border: none;
    background: transparent;
    color: var(--ink);
    font: inherit;
    padding: 10px 10px;
    outline: none;
  }
  .add-form input::placeholder { color: var(--ink-faint); }
  .add-btn {
    appearance: none;
    border: none;
    background: var(--blue);
    color: #fff;
    font: inherit;
    font-weight: 500;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: opacity .15s;
    letter-spacing: 0.01em;
  }
  .add-btn:hover { opacity: 0.9; }
  .add-btn:disabled { background: var(--ink-faint); cursor: not-allowed; }

  /* Section labels */
  .section-label {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 28px 0 10px;
    color: var(--ink-soft);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    font-weight: 500;
  }
  .section-label .line { flex: 1; height: 1px; background: var(--line); }
  .section-label .count {
    color: var(--ink-faint);
    font-variant-numeric: tabular-nums;
  }

  /* Reminders */
  .reminders {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .reminder {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    transition: border-color .15s, background .15s;
    animation: slide-in .22s ease-out;
  }
  @keyframes slide-in {
    from { opacity: 0; transform: translateY(-3px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @media (prefers-reduced-motion: reduce) {
    .reminder { animation: none; }
  }
  .reminder:hover { border-color: var(--line-strong); }
  .reminder.done {
    background: transparent;
    border-color: transparent;
  }
  .reminder.done .text {
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1px;
    color: var(--ink-faint);
  }

  .check {
    appearance: none;
    width: 20px;
    height: 20px;
    min-width: 20px;
    border: 1.5px solid var(--line-strong);
    border-radius: 50%;
    cursor: pointer;
    position: relative;
    margin-top: 1px;
    transition: all .15s;
    flex-shrink: 0;
    background: transparent;
  }
  .check:hover { border-color: var(--blue); }
  .check:checked {
    background: var(--blue);
    border-color: var(--blue);
  }
  .check:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 2px;
    width: 5px;
    height: 10px;
    border: solid white;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .check:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 2px;
  }

  .reminder-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .text {
    color: var(--ink);
    overflow-wrap: break-word;
    word-break: break-word;
  }
  .meta {
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    align-items: center;
    gap: 6px;
    font-variant-numeric: tabular-nums;
    flex-wrap: wrap;
  }
  .meta .heart-mini {
    color: var(--red);
    opacity: 0.65;
  }
  .meta .heart-mini svg { width: 10px; height: 10px; display: block; }

  .delete-btn {
    opacity: 0;
    appearance: none;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    padding: 4px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all .15s;
    flex-shrink: 0;
    margin-top: -2px;
  }
  .reminder:hover .delete-btn,
  .reminder:focus-within .delete-btn {
    opacity: 1;
  }
  .delete-btn:hover {
    color: var(--red);
    background: var(--red-soft);
  }
  .delete-btn:focus-visible {
    opacity: 1;
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .delete-btn svg { width: 14px; height: 14px; display: block; }
  @media (hover: none) {
    .delete-btn { opacity: 0.55; }
  }

  /* Empty state */
  .empty {
    text-align: center;
    padding: 56px 20px 32px;
    color: var(--ink-soft);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }
  .empty .big-heart {
    color: var(--red);
    opacity: 0.35;
    margin-bottom: 10px;
  }
  .empty .big-heart svg { width: 36px; height: 36px; display: block; }
  .empty p { margin: 0; font-size: 14px; }
  .empty .hint { color: var(--ink-faint); font-size: 13px; }

  /* Footer */
  .footer {
    margin-top: 44px;
    text-align: center;
    color: var(--ink-faint);
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    letter-spacing: 0.02em;
  }
  .footer svg {
    width: 11px;
    height: 11px;
    color: var(--red);
    display: block;
  }

  @media (max-width: 500px) {
    body { padding-block: 24px 36px; }
    .header { padding: 10px 0 28px; }
    .title { font-size: 32px; }
    .add-btn { padding: 10px 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="hearts" aria-hidden="true">
      <svg class="h-red" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <svg class="h-blue" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      <svg class="h-red" viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    </div>
    <h1 class="title">Nuestros <em>recordatorios</em></h1>
    <p class="subtitle" id="subtitle">una lista para los dos</p>
  </header>

  <form class="add-form" id="add-form">
    <input type="text" id="add-input" placeholder="Escribe algo para los dos…" autocomplete="off" maxlength="280" aria-label="Nuevo recordatorio" />
    <button type="submit" class="add-btn" id="add-btn">Agregar</button>
  </form>

  <div id="content" aria-live="polite"></div>

  <footer class="footer">
    <span>hecho con</span>
    <svg viewBox="0 0 24 24" fill="currentColor" aria-label="corazón"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    <span>para los dos</span>
  </footer>
</div>

<script>
(function() {
  'use strict';

  const STORAGE_KEY = 'nuestros-recordatorios';
  const content = document.getElementById('content');
  const form = document.getElementById('add-form');
  const input = document.getElementById('add-input');
  const subtitle = document.getElementById('subtitle');

  // Localized date subtitle
  try {
    const d = new Date();
    const fmt = new Intl.DateTimeFormat('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
    subtitle.textContent = fmt.format(d);
  } catch (e) {}

  const HEART_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
  const TRASH_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>';

  let reminders = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      const parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      return [];
    }
  }

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(reminders));
    } catch (e) {
      console.warn('No se pudo guardar en localStorage', e);
    }
  }

  // Cross-tab sync
  window.addEventListener('storage', e => {
    if (e.key === STORAGE_KEY) {
      reminders = load();
      render();
    }
  });

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    const now = new Date();
    const sameDay = d.toDateString() === now.toDateString();
    const yd = new Date(now); yd.setDate(now.getDate() - 1);
    const isYesterday = d.toDateString() === yd.toDateString();
    const pad = n => n.toString().padStart(2, '0');
    if (sameDay) return `hoy, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    if (isYesterday) return 'ayer';
    const diffDays = Math.round((now - d) / 86400000);
    if (diffDays < 7) return `hace ${diffDays} d`;
    return d.toLocaleDateString('es-MX', { day: 'numeric', month: 'short' });
  }

  function render() {
    if (reminders.length === 0) {
      content.innerHTML = `
        <div class="empty">
          <div class="big-heart" aria-hidden="true">${HEART_SVG}</div>
          <p>Todavía no hay recordatorios.</p>
          <p class="hint">Agrega el primero arriba.</p>
        </div>
      `;
      return;
    }

    const pending = reminders.filter(r => !r.completed);
    const done = reminders.filter(r => r.completed);
    pending.sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''));
    done.sort((a, b) => (b.completedAt || '').localeCompare(a.completedAt || ''));

    const sections = [];
    if (pending.length > 0) sections.push(renderSection('Pendientes', pending));
    if (done.length > 0) sections.push(renderSection('Hechos', done));
    content.innerHTML = sections.join('');

    content.querySelectorAll('.check').forEach(el => {
      el.addEventListener('change', () => toggleDone(el.dataset.id, el.checked));
    });
    content.querySelectorAll('.delete-btn').forEach(el => {
      el.addEventListener('click', () => deleteReminder(el.dataset.id));
    });
  }

  function renderSection(label, items) {
    return `
      <div class="section-label">
        <span>${esc(label)}</span>
        <span class="line"></span>
        <span class="count">${items.length}</span>
      </div>
      <div class="reminders">
        ${items.map(renderReminder).join('')}
      </div>
    `;
  }

  function renderReminder(r) {
    const timeStr = formatTime(r.createdAt);
    return `
      <div class="reminder ${r.completed ? 'done' : ''}">
        <input type="checkbox" class="check" data-id="${esc(r.id)}" ${r.completed ? 'checked' : ''} aria-label="Marcar como hecho" />
        <div class="reminder-body">
          <div class="text">${esc(r.text)}</div>
          <div class="meta">
            <span class="heart-mini" aria-hidden="true">${HEART_SVG}</span>
            ${timeStr ? `<span>${esc(timeStr)}</span>` : ''}
          </div>
        </div>
        <button class="delete-btn" data-id="${esc(r.id)}" aria-label="Borrar recordatorio" title="Borrar">${TRASH_SVG}</button>
      </div>
    `;
  }

  function newId() {
    try { if (crypto.randomUUID) return crypto.randomUUID(); } catch (e) {}
    return 'r_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
  }

  function addReminder(text) {
    reminders.push({
      id: newId(),
      text,
      createdAt: new Date().toISOString(),
      completed: false
    });
    save();
    render();
  }

  function toggleDone(id, done) {
    const r = reminders.find(x => x.id === id);
    if (!r) return;
    r.completed = done;
    r.completedAt = done ? new Date().toISOString() : null;
    save();
    render();
  }

  function deleteReminder(id) {
    reminders = reminders.filter(x => x.id !== id);
    save();
    render();
  }

  form.addEventListener('submit', e => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.focus();
    addReminder(text);
  });

  render();
})();
</script>
</body>
</html>
